<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Gardening - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% load static %}
    <link rel="stylesheet" href="{% static 'my_app/css/style.css' %}">
</head>

<body class="flex items-center justify-center min-h-screen relative overflow-hidden">

    <!-- Background Glass Blobs -->
    <div class="absolute top-[-10%] left-[-10%] w-[45vw] h-[45vw] bg-emerald-200 rounded-full mix-blend-multiply filter blur-[120px] opacity-20 animate-blob"
        style="z-index: -1;"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[55vw] h-[55vw] bg-violet-200 rounded-full mix-blend-multiply filter blur-[150px] opacity-15 animate-blob"
        style="animation-delay: 2s; z-index: -1;"></div>

    <div class="max-w-2xl text-center px-10 py-16 glass-card rounded-[3rem] fade-in mx-4">

        <div class="flex justify-center mb-10">
            <div
                class="inline-flex items-center justify-center w-28 h-28 rounded-[2rem] bg-gradient-to-tr from-green-500 to-emerald-400 text-white shadow-xl rotate-3 shadow-green-500/30 transition-transform duration-300 hover:rotate-0 hover:scale-105">
                <svg class="w-14 h-14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                        d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z">
                    </path>
                </svg>
            </div>
        </div>

        <h1 class="text-4xl md:text-5xl font-extrabold mb-6 text-slate-900 tracking-tight leading-tight">
            Next-Gen Smart <br> Gardening System
        </h1>

        <p class="text-lg md:text-xl text-slate-600 mb-12 max-w-xl mx-auto font-medium leading-relaxed">
            Monitor soil moisture, automate water pumps, and keep your garden thriving perfectly from an elegant,
            centralized dashboard.
        </p>

        <div class="flex flex-col sm:flex-row items-center justify-center gap-6">
            <a href="{% url 'login' %}"
                class="w-full sm:w-auto inline-flex items-center justify-center px-12 py-4 text-lg font-bold text-white btn-gradient rounded-2xl focus:outline-none focus:ring-4 focus:ring-green-300/50">
                Access Dashboard
                <svg class="w-5 h-5 ml-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                        d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                </svg>
            </a>
        </div>
    </div>
</body>

</html>
