<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Gardening - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% load static %}
    <link rel="stylesheet" href="{% static 'my_app/css/style.css' %}">
</head>
<body class="flex items-center justify-center min-h-screen relative overflow-hidden">

    <!-- Background Glass Blobs -->
    <div class="absolute top-[-10%] left-[-10%] w-[45vw] h-[45vw] bg-emerald-200 rounded-full mix-blend-multiply filter blur-[120px] opacity-20 animate-blob" style="z-index: -1;"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[55vw] h-[55vw] bg-violet-200 rounded-full mix-blend-multiply filter blur-[150px] opacity-15 animate-blob" style="animation-delay: 2s; z-index: -1;"></div>
    
    <div class="w-full max-w-md p-10 glass-card rounded-[2.5rem] z-10 fade-in mx-4">
        
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-gradient-to-tr from-green-500 to-emerald-400 text-white shadow-lg mb-6 hover:rotate-6 hover:scale-105 transition-transform duration-300 shadow-green-500/30">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg>
            </div>
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Welcome Back</h1>
            <p class="text-slate-500 mt-2 text-sm font-medium">Log in to your Smart Garden Dashboard</p>
        </div>

        {% if messages %}
        <div class="mb-8 space-y-3">
            {% for message in messages %}
            <div class="flex items-center p-4 bg-red-100 text-red-600 rounded-2xl text-sm font-bold border border-red-200 shadow-sm animate-[pulse_2s_ease-in-out]">
                <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}" class="space-y-6">
            {% csrf_token %}
            <div>
                <label for="username" class="block text-sm font-bold text-slate-700 mb-2 ml-1 uppercase tracking-wider">Username</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none transition-colors group-focus-within:text-green-500">
                        <svg class="h-5 w-5 text-slate-400 group-focus-within:text-green-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </div>
                    <input type="text" name="username" id="username" required placeholder="admin"
                           class="block w-full pl-11 pr-4 py-4 rounded-2xl text-sm outline-none transition-all shadow-sm">
                </div>
            </div>
            
            <div>
                <label for="password" class="block text-sm font-bold text-slate-700 mb-2 ml-1 uppercase tracking-wider">Password</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none transition-colors group-focus-within:text-green-500">
                        <svg class="h-5 w-5 text-slate-400 group-focus-within:text-green-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    </div>
                    <input type="password" name="password" id="password" required placeholder="••••••••"
                           class="block w-full pl-11 pr-4 py-4 rounded-2xl text-sm outline-none transition-all shadow-sm">
                </div>
            </div>
            
            <div class="pt-4">
                <button type="submit" 
                        class="w-full flex justify-center py-4 px-4 btn-gradient text-white rounded-2xl text-lg font-bold tracking-wide focus:outline-none focus:ring-4 focus:ring-green-500/50">
                    Sign In
                </button>
            </div>
        </form>
    </div>
</body>
</html>
