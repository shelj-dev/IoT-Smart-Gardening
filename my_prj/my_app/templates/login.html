<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Gardening - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        blob: "blob 15s infinite alternate",
                    },
                    keyframes: {
                        blob: {
                            "0%": { transform: "translate(0px, 0px) scale(1)" },
                            "100%": { transform: "translate(30px, 50px) scale(1.1)" }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        
        .bg-gradient-dark {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn-gradient {
            background: linear-gradient(90deg, #10b981, #059669);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }
        .btn-gradient:hover {
            transform: scale(0.98);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }
        .btn-gradient:active {
            transform: scale(0.95);
        }

        .input-dark {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
        }
        .input-dark:focus {
            background: rgba(255, 255, 255, 0.05);
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }
        .input-dark::placeholder {
            color: #64748b;
        }
        
        .fade-in { animation: fadeIn 0.6s ease-out forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gradient-dark flex items-center justify-center min-h-screen relative overflow-hidden">

    <!-- Background Glass Blobs -->
    <div class="absolute top-[-10%] left-[-10%] w-[40vw] h-[40vw] bg-emerald-500 rounded-full mix-blend-screen filter blur-[100px] opacity-20 animate-blob" style="z-index: -1;"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[50vw] h-[50vw] bg-violet-500 rounded-full mix-blend-screen filter blur-[120px] opacity-15 animate-blob" style="animation-delay: 2s; z-index: -1;"></div>
    
    <div class="w-full max-w-md p-8 sm:p-10 glass-card rounded-3xl z-10 fade-in mx-4">
        
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-tr from-green-500 to-emerald-400 text-white shadow-lg mb-4 hover:rotate-6 hover:scale-105 transition-transform duration-300 shadow-green-500/30">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg>
            </div>
            <h1 class="text-2xl font-extrabold text-white tracking-tight">Welcome Back</h1>
            <p class="text-slate-400 mt-2 text-sm font-medium">Log in to Smart Gardening System</p>
        </div>

        {% if messages %}
        <div class="mb-6 space-y-2">
            {% for message in messages %}
            <div class="flex items-center p-4 bg-red-500/10 text-red-400 rounded-2xl text-sm font-semibold border border-red-500/20 shadow-sm animate-[pulse_2s_ease-in-out]">
                <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}" class="space-y-5">
            {% csrf_token %}
            <div>
                <label for="username" class="block text-sm font-semibold text-slate-300 mb-1.5 ml-1">Username</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none transition-colors group-focus-within:text-green-500">
                        <svg class="h-5 w-5 text-slate-500 group-focus-within:text-green-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </div>
                    <input type="text" name="username" id="username" required placeholder="admin"
                           class="block w-full pl-11 pr-4 py-3.5 input-dark rounded-2xl text-sm outline-none transition-all shadow-sm">
                </div>
            </div>
            
            <div>
                <label for="password" class="block text-sm font-semibold text-slate-300 mb-1.5 ml-1">Password</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none transition-colors group-focus-within:text-green-500">
                        <svg class="h-5 w-5 text-slate-500 group-focus-within:text-green-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    </div>
                    <input type="password" name="password" id="password" required placeholder="••••••••"
                           class="block w-full pl-11 pr-4 py-3.5 input-dark rounded-2xl text-sm outline-none transition-all shadow-sm">
                </div>
            </div>
            
            <div class="pt-4">
                <button type="submit" 
                        class="w-full flex justify-center py-3.5 px-4 btn-gradient text-white rounded-2xl text-sm font-bold tracking-wide focus:outline-none focus:ring-4 focus:ring-green-500/50">
                    Sign In
                </button>
            </div>
        </form>
    </div>

</body>
</html>
