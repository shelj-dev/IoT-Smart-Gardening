<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Gardening - Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .bg-gradient-dark {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            background-attachment: fixed;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }
    </style>
</head>
<body class="bg-gradient-dark flex items-center justify-center min-h-screen">

    <div class="max-w-2xl text-center px-8 lg:px-12 py-16 glass-card rounded-[2.5rem] transform transition-transform duration-500 hover:scale-[1.02] mx-4">
        
        <div class="flex justify-center mb-8">
            <div class="inline-flex items-center justify-center w-24 h-24 rounded-[1.5rem] bg-gradient-to-tr from-green-500 to-emerald-400 text-white shadow-xl rotate-3 shadow-green-500/30">
                <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
        </div>
        
        <h1 class="text-4xl md:text-5xl font-extrabold mb-5 bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-slate-400 tracking-tight leading-tight">
            Welcome, {{ user.username|default:"User" }}!
        </h1>
        
        <p class="text-lg md:text-xl text-slate-400 mb-12 max-w-xl mx-auto font-medium leading-relaxed">
            Welcome to the Smart Gardening System. Your garden is happy to see you again! Please select an option below to continue.
        </p>
        
        <div class="flex flex-col sm:flex-row items-center justify-center space-y-4 sm:space-y-0 sm:space-x-4">
            <a href="{% url 'dashboard' %}" 
               class="w-full sm:w-auto inline-flex items-center justify-center px-10 py-4 text-lg font-bold text-white bg-gradient-to-r from-green-600 to-emerald-500 hover:from-green-500 hover:to-emerald-400 rounded-2xl shadow-lg shadow-green-500/30 transform transition-all duration-300 hover:-translate-y-1 focus:outline-none focus:ring-4 focus:ring-green-500/50">
                Dashboard
                <svg class="w-5 h-5 ml-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
            </a>
            
            <!-- <a href="{% url 'help' %}" 
               class="w-full sm:w-auto inline-flex items-center justify-center px-10 py-4 text-lg font-bold text-slate-300 bg-white/5 hover:bg-white/10 rounded-2xl border border-white/10 transition-all duration-300 hover:-translate-y-1 shadow-sm">
                Help
                <svg class="w-5 h-5 ml-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </a> -->
        </div>
    </div>

</body>
</html>
