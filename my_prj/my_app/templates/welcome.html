<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Gardening - Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% load static %}
    <link rel="stylesheet" href="{% static 'my_app/css/style.css' %}">
</head>

<body class="bg-gradient-dark flex items-center justify-center min-h-screen relative overflow-hidden">
    <!-- Background Glass Blobs (Subtle over image) -->
    <div class="absolute top-[-10%] left-[-10%] w-[40vw] h-[40vw] bg-emerald-100 rounded-full mix-blend-multiply filter blur-[150px] opacity-15 animate-blob" style="z-index: -1;"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[50vw] h-[50vw] bg-violet-100 rounded-full mix-blend-multiply filter blur-[180px] opacity-10 animate-blob" style="animation-delay: 2s; z-index: -1;"></div>


    <div
        class="max-w-2xl text-center px-8 lg:px-12 py-16 glass-card rounded-[2.5rem] transform transition-transform duration-500 hover:scale-[1.02] mx-4">

        <div class="flex justify-center mb-8">
            <div
                class="inline-flex items-center justify-center w-24 h-24 rounded-[1.5rem] bg-gradient-to-tr from-green-500 to-emerald-400 text-white shadow-xl rotate-3 shadow-green-500/30">
                <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                        d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
        </div>

        <h1
            class="text-4xl md:text-5xl font-extrabold mb-5 text-slate-800 tracking-tight leading-tight">
            Welcome, {{ user.username|default:"User" }}!
        </h1>

        <p class="text-lg md:text-xl text-slate-600 mb-12 max-w-xl mx-auto font-medium leading-relaxed">
            Welcome to the Smart Gardening System. Your garden is happy to see you again! Please select an option below
            to continue.
        </p>

        <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
            <a href="{% url 'dashboard' %}"
                class="w-full sm:w-auto inline-flex items-center justify-center px-10 py-4 text-lg font-bold text-white btn-gradient rounded-2xl shadow-xl transition-all duration-300 transform">
                Go to Dashboard
                <svg class="w-5 h-5 ml-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                        d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                </svg>
            </a>

            <a href="{% url 'about' %}"
                class="w-full sm:w-auto inline-flex items-center justify-center px-10 py-4 text-lg font-bold text-slate-700 bg-white/50 backdrop-blur-md border border-slate-200 hover:bg-slate-100 rounded-2xl transition-all duration-300 transform hover:-translate-y-1 shadow-sm">
                About System
                <svg class="w-5 h-5 ml-2.5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                   <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </a>

            <!-- <a href="{% url 'help' %}"
                class="w-full sm:w-auto inline-flex items-center justify-center px-10 py-4 text-lg font-bold text-slate-700 bg-white/50 backdrop-blur-md border border-slate-200 hover:bg-slate-100 rounded-2xl transition-all duration-300 transform hover:-translate-y-1 shadow-sm">
                Help / Guide
                <svg class="w-5 h-5 ml-2.5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                   <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </a> -->
        </div>
    </div>

</body>

</html>
